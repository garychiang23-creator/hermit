<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1b33">
<title>SANASAI 沙那賽</title>
<style>
  :root {
    --paper: #fbf7ef; --paper-2: #f3ede1; --paper-3: #e6ddcb;
    --glass: rgba(251, 247, 239, .94);
    --ink: #16213a; --ink-2: #4b556b; --ink-3: #8b91a1;
    --line: rgba(22, 33, 58, .1); --line-2: rgba(22, 33, 58, .18);
    --sea: #1d7d8b; --gold: #b8841f;
    --copper: #b87333; --jade: #12a072; --crystal: #3fa9c4;
    --shadow: 0 12px 32px rgba(15, 22, 42, .16), 0 2px 6px rgba(15, 22, 42, .08);
    --shadow-s: 0 4px 14px rgba(15, 22, 42, .13);
    --r-lg: 22px;
    --ui: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Heiti TC", system-ui, sans-serif;
    --display: "Futura", "Avenir Next", "Century Gothic", "Helvetica Neue", Arial, sans-serif;
    --side-w: 340px;
    --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0d1b33; }
  body { font-family: var(--ui); color: var(--ink); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--sea); outline-offset: 2px; }
  [hidden] { display: none !important; }
  svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  #stage { position: fixed; inset: 0; touch-action: none; }
  #stage canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .panel { background: var(--glass); -webkit-backdrop-filter: blur(14px) saturate(1.15); backdrop-filter: blur(14px) saturate(1.15); border: 1px solid rgba(255, 255, 255, .7); box-shadow: var(--shadow); }
  .eyebrow { font-family: var(--display); font-size: 10.5px; font-weight: 600; letter-spacing: .26em; text-transform: uppercase; color: var(--sea); }

  /* ---------- 上方列 ---------- */
  .topbar { position: fixed; z-index: 12; top: calc(16px + var(--st)); left: 16px; right: calc(var(--side-w) + 16px); display: flex; align-items: flex-start; gap: 10px; pointer-events: none; transition: right .35s ease; }
  body.side-closed .topbar, body.log-open .topbar { right: 16px; }
  body.log-open .topbar { right: 362px; }
  .topbar > * { pointer-events: auto; }
  .brand { display: flex; align-items: center; gap: 14px; padding: 11px 12px 11px 20px; border-radius: var(--r-lg); flex: none; }
  .wordmark { font-family: var(--display); font-weight: 500; font-size: 21px; letter-spacing: .36em; margin-right: -.36em; color: var(--ink); text-decoration: none; line-height: 1; }
  .brand-keys { display: flex; gap: 5px; padding-left: 14px; border-left: 1px solid var(--line-2); }
  .kchip { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--paper-2); color: #b4b9c5; border: 0; padding: 0; transition: background .4s, color .4s, box-shadow .4s; }
  .kchip svg.i { width: 16px; height: 16px; stroke-width: 1.9; }
  .kchip.owned { color: #fff; }
  .kchip.owned.copper { background: var(--copper); box-shadow: 0 0 0 3px rgba(184, 115, 51, .18), 0 0 14px rgba(224, 154, 90, .55); }
  .kchip.owned.jade { background: var(--jade); box-shadow: 0 0 0 3px rgba(18, 160, 114, .18), 0 0 14px rgba(75, 232, 168, .5); }
  .kchip.owned.crystal { background: var(--crystal); box-shadow: 0 0 0 3px rgba(63, 169, 196, .2), 0 0 14px rgba(165, 242, 243, .7); }
  .kchip.ready { color: var(--gold); background: #fbf0d8; animation: ready 1.8s ease-in-out infinite; }
  @keyframes ready { 50% { box-shadow: 0 0 0 4px rgba(184, 132, 31, .25); } }
  .hud { display: flex; gap: 8px; flex: none; }
  .seg { display: flex; align-items: center; gap: 2px; padding: 5px; border-radius: 999px; }
  .seg button { border: 0; background: transparent; height: 40px; min-width: 40px; border-radius: 999px; display: grid; place-items: center; color: var(--ink-2); padding: 0 10px; transition: background .2s, color .2s; }
  .seg button:hover { background: rgba(22, 33, 58, .06); color: var(--ink); }
  .seg button.active, .seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .seg2 button { gap: 2px; height: 46px; padding: 5px 9px 4px; align-content: center; }
  .seg2 button span { font-size: 10.5px; line-height: 1; }
  .seg2 svg.i { width: 17px; height: 17px; }
  .spacer { flex: 1; }
  .toolbar { display: flex; gap: 8px; flex: none; }
  .tb { height: 46px; padding: 0 15px; border-radius: 15px; border: 1px solid rgba(255, 255, 255, .7); background: var(--glass); box-shadow: var(--shadow-s); display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 500; -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); white-space: nowrap; }
  .tb svg.i { width: 15px; height: 15px; stroke-width: 1.9; }
  .tb:hover { background: #fff; }
  .tb[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .tb.help { width: 46px; padding: 0; justify-content: center; font-family: var(--display); font-size: 16px; }
  .tb.help span { display: none; }
  .mob-only { display: none !important; }

  /* ---------- 右側清單 ---------- */
  .sidebar { position: fixed; z-index: 11; top: 0; right: 0; bottom: 0; width: var(--side-w); background: var(--paper); border-left: 1px solid var(--line); display: flex; flex-direction: column; transition: transform .35s ease; box-shadow: -10px 0 30px rgba(15, 22, 42, .07); }
  body.side-closed .sidebar { transform: translateX(104%); }
  .sheet-handle { display: none; }
  .side-head { padding: calc(28px + var(--st)) 24px 14px; }
  .side-head h2 { margin: 9px 0 8px; font-size: 25px; line-height: 1.25; font-weight: 700; }
  .side-head p { margin: 0; font-size: 13px; line-height: 1.7; color: var(--ink-2); }
  .side-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 18px; }
  .side-tabs button { height: 42px; border-radius: 12px; border: 1px solid var(--line-2); background: transparent; font-size: 13.5px; font-weight: 500; }
  .side-tabs button.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  .side-tabs b { font-family: var(--display); font-weight: 500; margin-left: 6px; opacity: .75; }
  .side-body { flex: 1; overflow-y: auto; padding: 4px 14px 18px; overscroll-behavior: contain; }
  .idx { display: grid; grid-template-columns: 50px 1fr auto; align-items: center; width: 100%; text-align: left; border: 0; background: transparent; padding: 15px 10px; border-radius: 14px; }
  .idx + .idx { box-shadow: 0 -1px 0 var(--line); }
  .idx:hover, .idx.active { background: var(--paper-2); box-shadow: none; }
  .idx .no { font-family: var(--display); font-size: 22px; font-weight: 500; color: var(--c, var(--sea)); }
  .idx b { display: block; font-size: 15px; font-weight: 600; }
  .idx small { display: block; margin-top: 3px; font-size: 12px; color: var(--ink-3); }
  .idx .go { color: var(--ink-3); }
  .idx .go svg.i { width: 15px; height: 15px; }
  .side-note { margin: 14px 10px 0; font-size: 12px; color: var(--ink-3); line-height: 1.7; }
  .keyrow { padding: 15px 10px; }
  .keyrow + .keyrow { border-top: 1px solid var(--line); }
  .keyrow-top { display: flex; align-items: center; gap: 10px; }
  .keyrow-top b { font-size: 15px; }
  .state { margin-left: auto; font-size: 11.5px; padding: 3px 10px; border-radius: 999px; background: var(--paper-2); color: var(--ink-2); white-space: nowrap; font-weight: 500; }
  .state.ok { background: #e2f3eb; color: #0d7552; }
  .state.ready { background: #fbefd5; color: #8f620c; }
  .keyrow p { margin: 8px 0 0 40px; font-size: 12.5px; line-height: 1.65; color: var(--ink-2); }
  .bar { height: 6px; border-radius: 99px; background: var(--paper-3); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: inherit; background: var(--c, var(--sea)); transition: width .6s ease; }
  .keyrow .bar { margin: 10px 0 0 40px; }
  .side-foot { display: none; padding: 12px 18px calc(14px + var(--sb)); border-top: 1px solid var(--line); }
  .foot-toggles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .foot-toggles button { height: 38px; border-radius: 11px; border: 1px solid var(--line-2); background: #fff; font-size: 12.5px; }
  .foot-toggles button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }

  /* ---------- 地點卡片 ---------- */
  .card { position: fixed; z-index: 10; top: calc(100px + var(--st)); left: 16px; bottom: 16px; width: 372px; border-radius: var(--r-lg); display: flex; flex-direction: column; overflow: hidden; animation: cardIn .35s ease; }
  @keyframes cardIn { from { opacity: 0; transform: translateX(-14px); } }
  .card-scroll { overflow-y: auto; padding: 22px 22px 18px; flex: 1; overscroll-behavior: contain; }
  .close { position: absolute; top: 14px; right: 14px; width: 36px; height: 36px; border-radius: 50%; border: 0; background: transparent; font-size: 24px; line-height: 1; color: var(--ink-2); z-index: 2; }
  .close:hover { background: rgba(22, 33, 58, .07); }
  .card-head { display: flex; gap: 14px; align-items: center; padding-right: 34px; }
  .tile { width: 56px; height: 56px; border-radius: 17px; display: grid; place-items: center; flex: none; color: var(--c); background: var(--cs); }
  .tile svg.i { width: 27px; height: 27px; stroke-width: 1.6; }
  .card h3 { margin: 5px 0 0; font-size: 22px; line-height: 1.25; font-weight: 700; }
  .card h3 small { font-family: var(--display); font-size: 11px; letter-spacing: .2em; font-weight: 500; color: var(--ink-3); margin-left: 8px; }
  .lead { margin: 16px 0 0; font-size: 14px; line-height: 1.8; color: var(--ink-2); }
  .quote { margin: 14px 0 0; padding: 2px 0 2px 14px; border-left: 3px solid var(--c, var(--sea)); font-size: 14px; line-height: 1.75; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .chip { font-size: 12px; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line-2); background: #fff; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
  .chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
  .sec { margin: 22px 0 10px; font-size: 12px; font-weight: 600; color: var(--ink-3); letter-spacing: .06em; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: #fff; border: 1px solid var(--line); border-radius: 13px; padding: 10px 11px 9px; min-width: 0; }
  .stat small { display: block; font-size: 11px; color: var(--ink-3); white-space: nowrap; }
  .stat b { display: block; margin-top: 3px; font-family: var(--display); font-weight: 500; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat.hero { grid-column: span 3; display: flex; align-items: baseline; justify-content: space-between; padding: 13px 14px; }
  .stat.hero b { font-size: 26px; margin: 0; }
  .stat.dim b { color: var(--ink-3); }
  .empty { font-size: 13px; color: var(--ink-2); background: var(--paper-2); border-radius: 13px; padding: 12px 14px; line-height: 1.7; }
  .keybox { border-radius: 14px; padding: 13px 14px; background: #fff; border: 1px solid var(--line); }
  .keybox .top { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; }
  .keybox .kchip { width: 28px; height: 28px; }
  .keybox p { margin: 9px 0 0; font-size: 12.5px; color: var(--ink-2); line-height: 1.65; }
  .keybox .bar { margin-top: 10px; }
  .keybox .btn { margin-top: 10px; height: 38px; width: 100%; font-size: 13px; }
  .chapters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .chap { font-size: 12.5px; border-radius: 11px; padding: 9px 10px; background: var(--paper-2); color: var(--ink-3); display: flex; align-items: center; gap: 7px; }
  .chap.done { background: #fff3d9; color: #845a06; font-weight: 600; }
  .chap i { width: 8px; height: 8px; border-radius: 50%; background: #cbc4b5; flex: none; }
  .chap.done i { background: #f0a500; box-shadow: 0 0 8px #ffbf3f; }
  .note { margin: 10px 0 0; font-size: 12px; color: var(--ink-3); line-height: 1.65; }
  .actions { display: flex; gap: 8px; padding: 14px 22px 16px; border-top: 1px solid var(--line); background: rgba(251, 247, 239, .75); }
  .actions:empty { display: none; }
  .btn { height: 46px; border-radius: 13px; border: 1px solid var(--line-2); background: #fff; padding: 0 16px; font-size: 14.5px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; color: var(--ink); white-space: nowrap; }
  .btn:hover { border-color: var(--ink-3); }
  .btn.primary { flex: 1; background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn.primary:hover { background: #24304f; }
  .btn svg.i { width: 16px; height: 16px; }

  /* ---------- 3D 名牌 ---------- */
  .pin-wrap { padding-bottom: 6px; }
  .pin { pointer-events: auto; border: 0; display: inline-flex; align-items: center; gap: 7px; padding: 5px 13px 5px 5px; border-radius: 999px; background: rgba(255, 253, 248, .96); box-shadow: 0 4px 14px rgba(15, 22, 42, .2); font-size: 13px; font-weight: 600; color: var(--ink); white-space: nowrap; transition: transform .2s, background .2s, color .2s; }
  .pin .no { font-family: var(--display); font-size: 11px; font-weight: 600; color: #fff; background: var(--c); border-radius: 999px; min-width: 25px; height: 22px; display: grid; place-items: center; padding: 0 6px; letter-spacing: .04em; }
  .pin:hover { transform: translateY(-3px); }
  .pin.active { background: var(--ink); color: #fff; }
  .pin.key { font-size: 12px; padding: 4px 11px 4px 4px; }
  .pin.key .no { min-width: 22px; height: 20px; padding: 0; }
  .pin.key .no svg.i { width: 12px; height: 12px; stroke-width: 2.2; }
  .pin.me { background: #0f9fb5; color: #fff; font-size: 11.5px; padding: 3px 10px; box-shadow: 0 3px 10px rgba(15, 159, 181, .4); }
  body.names-off .pin:not(.active) { display: none; }
  .pin.pet { background: #fff6ea; font-size: 12px; padding: 4px 11px 4px 4px; }
  .pin.pet .no { min-width: 22px; height: 20px; padding: 0; }
  .pin.pet .no svg.i { width: 13px; height: 13px; stroke-width: 2; }
  .idx .no svg.i { width: 24px; height: 24px; }
  .bubble { display: inline-block; pointer-events: none; font-size: 13px; font-weight: 700; color: var(--ink); background: #fff; border-radius: 999px; padding: 3px 11px; box-shadow: 0 3px 10px rgba(15, 22, 42, .22); white-space: nowrap; animation: bubble 1.6s ease forwards; }
  @keyframes bubble { 0% { opacity: 0; transform: translateY(6px) scale(.8); } 15% { opacity: 1; transform: none; } 70% { opacity: 1; } 100% { opacity: 0; transform: translateY(-16px); } }

  /* ---------- 日誌 ---------- */
  .log { position: fixed; z-index: 11; top: calc(16px + var(--st)); right: 16px; bottom: 16px; width: 330px; border-radius: var(--r-lg); display: flex; flex-direction: column; overflow: hidden; animation: cardIn .3s ease; }
  .log-head { position: relative; padding: 20px 20px 12px; }
  .log-head h3 { margin: 5px 0 0; font-size: 19px; }
  .log-tabs { margin: 0 16px; display: grid; grid-template-columns: 1fr 1fr; background: var(--paper-2); border-radius: 12px; padding: 4px; }
  .log-tabs button { border: 0; background: transparent; height: 36px; border-radius: 9px; font-size: 13px; color: var(--ink-2); }
  .log-tabs button.active { background: #fff; color: var(--ink); box-shadow: 0 1px 4px rgba(15, 22, 42, .1); font-weight: 600; }
  .log-list { list-style: none; margin: 8px 0 0; padding: 0 16px 16px; overflow-y: auto; flex: 1; overscroll-behavior: contain; }
  .log-list li { display: grid; grid-template-columns: 44px 1fr; gap: 10px; padding: 11px 2px; border-bottom: 1px solid var(--line); font-size: 13px; line-height: 1.6; }
  .log-list li.empty-row { display: block; color: var(--ink-3); border: 0; }
  .tag { font-size: 11px; font-weight: 600; text-align: center; border-radius: 7px; padding: 3px 0; height: fit-content; background: var(--paper-2); color: var(--ink-2); }
  .tag.rec { background: #e3eff8; color: #1f6c96; }
  .tag.key { background: #fbefd5; color: #8f620c; }
  .tag.land { background: #e4f2e8; color: #2d7744; }
  .tag.play { background: #eee8f8; color: #5a4695; }
  .tag.gate { background: #fff0c4; color: #7a5200; }
  .log-list time { font-family: var(--display); font-size: 11.5px; color: var(--ink-3); margin-right: 6px; }
  .log-overview { padding: 14px 16px 16px; overflow-y: auto; flex: 1; }
  .ov-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ov-grid .stat b { font-size: 20px; }
  .ov-line { display: flex; justify-content: space-between; gap: 10px; padding: 11px 2px; border-bottom: 1px solid var(--line); font-size: 13px; }
  .ov-line span:last-child { color: var(--ink-2); text-align: right; }

  /* ---------- 底部：快速前往、提示 ---------- */
  .dock { position: fixed; z-index: 9; bottom: calc(18px + var(--sb)); left: calc((100% - var(--side-w)) / 2); transform: translateX(-50%); display: flex; gap: 3px; padding: 6px; border-radius: 20px; transition: left .35s ease; }
  body.side-closed .dock { left: 50%; }
  body.card-open .dock { left: calc(392px + (100% - 392px - var(--side-w)) / 2); }
  body.card-open.side-closed .dock { left: calc(392px + (100% - 392px) / 2); }
  body.log-open .dock { left: calc((100% - 346px) / 2); }
  .dock button { border: 0; background: transparent; display: flex; align-items: center; gap: 9px; height: 46px; padding: 0 14px 0 7px; border-radius: 14px; font-size: 13.5px; font-weight: 600; white-space: nowrap; }
  .dock button i { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: var(--cs); color: var(--c); }
  .dock button i svg.i { width: 18px; height: 18px; }
  .dock button:hover { background: rgba(22, 33, 58, .06); }
  .dock button.active { background: var(--ink); color: #fff; }
  .hint { position: fixed; z-index: 9; left: 16px; bottom: calc(18px + var(--sb)); display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 8px; border-radius: 999px; font-size: 13px; color: var(--ink); max-width: min(440px, calc(50vw - 200px)); border: 1px solid rgba(255, 255, 255, .7); text-align: left; transition: opacity .3s, background .3s, color .3s; }
  .hint .halo { width: 28px; height: 28px; border-radius: 50%; flex: none; background: radial-gradient(circle at 50% 50%, #fff 0 22%, #19c2d8 24% 100%); box-shadow: 0 0 0 3px rgba(25, 194, 216, .2); }
  .hint.prompt { background: var(--ink); color: #fff; border-color: var(--ink); }
  .hint.lore { background: #2a2a33; color: #f1e6c8; border-color: #2a2a33; }
  body.card-open .hint { opacity: 0; pointer-events: none; }
  .toast { position: fixed; z-index: 30; top: calc(90px + var(--st)); left: 50%; transform: translate(-50%, -8px); opacity: 0; pointer-events: none; background: var(--ink); color: #fff; padding: 11px 20px; border-radius: 999px; font-size: 14px; font-weight: 600; box-shadow: var(--shadow); transition: opacity .35s, transform .35s; white-space: nowrap; max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.gold { background: linear-gradient(90deg, #a8740f, #d29d33); }
  #joystick { position: fixed; z-index: 9; left: 18px; bottom: calc(92px + var(--sb)); width: 104px; height: 104px; border-radius: 50%; background: rgba(251, 247, 239, .3); border: 1.5px solid rgba(255, 255, 255, .8); box-shadow: var(--shadow-s); touch-action: none; display: none; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  #stick { position: absolute; left: 32px; top: 32px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255, 255, 255, .94); box-shadow: 0 3px 10px rgba(15, 22, 42, .28); }
  body.touch #joystick { display: block; }
  body.sheet-open #joystick, body.sheet-open .dock { display: none; }

  /* ---------- 導覽說明 ---------- */
  .intro { position: fixed; inset: 0; z-index: 35; display: grid; place-items: center; padding: 16px; background: rgba(14, 20, 36, .3); -webkit-backdrop-filter: blur(7px); backdrop-filter: blur(7px); animation: fade .3s ease; }
  .intro-box { width: min(440px, 100%); background: var(--paper); border-radius: 24px; padding: 30px 30px 24px; box-shadow: 0 24px 60px rgba(10, 15, 30, .3); }
  .intro-box h2 { margin: 12px 0 10px; font-size: 25px; line-height: 1.3; }
  .intro-box p { margin: 0; font-size: 14px; line-height: 1.85; color: var(--ink-2); min-height: 4.2em; }
  .intro-dots { display: flex; gap: 6px; margin-top: 20px; }
  .intro-dots i { width: 6px; height: 6px; border-radius: 99px; background: var(--paper-3); transition: width .3s, background .3s; }
  .intro-dots i.on { width: 22px; background: var(--ink); }
  .intro-actions { display: flex; justify-content: space-between; margin-top: 20px; }
  .intro-actions .btn.primary { flex: none; }
  @keyframes fade { from { opacity: 0; } }
